[package]
name = "buwiz-plugin"
version = "0.1.0"
description = "The plugin half of a Buwiz Bot mini app, protocol 2.0: MCP on stdio, the reserved buwiz.* tools, signing, tickets and the caller checks"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
# Session certificates are signed with the ed25519 key the Bot provisions.
ed25519-dalek = { version = "2", default-features = false, features = ["zeroize"] }
# Tickets: 130 bits from the OS CSPRNG.
getrandom = "0.3"
# Manifest hash, permissions digest and app fingerprints.
sha2 = "0.10"
serde_json = "1"

[lints]
workspace = true
